name: Build SukiSU-Ultra Kernel (通用版)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig (推荐 evo_defconfig 或 defconfig)'
        required: true
        default: 'evo_defconfig'
      device_name:
        description: '设备代号 (oneplus8 / kebab / instantnoodle 等)'
        required: true
        default: 'oneplus8'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: udc

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget python3 bc bison flex libssl-dev make gcc g++ clang lld llvm libelf-dev device-tree-compiler ccache zip

      - name: Integrate SukiSU-Ultra + SUSFS（推荐）
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main

      - name: Build Setup
        run: |
          mkdir -p out
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Make Defconfig
        run: make O=out ${{ inputs.defconfig }}

      - name: Compile Kernel
        run: |
          make O=out -j$(nproc) \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          
          # 通用设备支持配置
          sed -i "s/device.name1=.*/device.name1=${{ inputs.device_name }}/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=OnePlus8Pro/" anykernel.sh
          sed -i "s/device.name3=.*/device.name3=kebab/" anykernel.sh
          sed -i "s/device.name4=.*/device.name4=instantnoodle/" anykernel.sh
          
          zip -r9 ../SukiSU-Ultra-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Kernel
          path: SukiSU-Ultra-Kernel.zip
